<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ink</title>
<style>html,body{margin:0;height:100%}</style>
</head>
<body>
<script>
// Tiny loader: always fetch the newest app.js so updates aren't stuck behind caches.
(function () {
  var s = document.createElement('script');
  s.src = 'app.js?v=' + Date.now();
  s.onerror = function () { document.body.textContent = 'Ink plugin failed to load. Check your connection and reopen the note.'; };
  document.body.appendChild(s);
})();
</script>
</body>
</html>
